<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex, nofollow, noarchive"
    >

    <title>
        COE Data Dashboard Preview
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            min-height: 100%;
        }


        body {
            min-height: 100vh;

            display: grid;
            place-items: center;

            padding: 24px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #333333;

            background: #f4efe1;
        }


        .login-card {
            width: min(
                100%,
                420px
            );

            padding: 38px 36px 34px;

            border:
                1px solid
                rgba(
                    69,
                    0,
                    132,
                    0.16
                );

            border-radius: 18px;

            background: #ffffff;

            box-shadow:
                0 18px 45px
                rgba(
                    69,
                    0,
                    132,
                    0.12
                );
        }


        .brand-line {
            width: 46px;
            height: 5px;

            margin-bottom: 24px;

            border-radius: 999px;

            background: #dfd2aa;
        }


        .kicker {
            margin: 0 0 8px;

            color: #450084;

            font-size: 11px;
            font-weight: 700;

            letter-spacing: 0.12em;
            text-transform: uppercase;
        }


        h1 {
            margin: 0 0 10px;

            color: #450084;

            font-family:
                Georgia,
                serif;

            font-size: 25px;
            line-height: 1.2;
        }


        .description {
            margin: 0 0 28px;

            color: #595959;

            font-size: 14px;
            line-height: 1.55;
        }


        label {
            display: block;

            margin-bottom: 7px;

            color: #333333;

            font-size: 12px;
            font-weight: 700;
        }


        input {
            width: 100%;

            padding: 11px 12px;

            border:
                1px solid
                rgba(
                    69,
                    0,
                    132,
                    0.22
                );

            border-radius: 8px;

            color: #333333;

            background: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 14px;

            outline: none;
        }


        input:focus {
            border-color: #450084;

            box-shadow:
                0 0 0 3px
                rgba(
                    69,
                    0,
                    132,
                    0.10
                );
        }


        button {
            width: 100%;

            margin-top: 14px;

            padding: 12px 16px;

            border: 0;
            border-radius: 8px;

            color: #ffffff;

            background: #450084;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;
        }


        button:hover {
            opacity: 0.92;
        }


        .error-message {
            min-height: 20px;

            margin: 13px 0 0;

            color: #a12c2c;

            font-size: 12px;
            line-height: 1.4;
        }


        .preview-note {
            margin: 22px 0 0;

            padding-top: 18px;

            border-top:
                1px solid
                rgba(
                    69,
                    0,
                    132,
                    0.12
                );

            color: #595959;

            font-size: 11px;
            line-height: 1.5;
        }

    </style>

</head>


<body>

    <main class="login-card">

        <div class="brand-line"></div>


        <p class="kicker">
            James Madison University
        </p>


        <h1>
            COE Data Dashboard Preview
        </h1>


        <p class="description">
            This is preview purpose only. Please enter the preview password to continue.
        </p>


        <form id="loginForm">

            <label for="password">
                Password
            </label>


            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                autofocus
                required
            >


            <button type="submit">
                Continue
            </button>


            <p
                id="errorMessage"
                class="error-message"
                aria-live="polite"
            ></p>

        </form>


        <p class="preview-note">
            Preview and testing purpose only.
        </p>

    </main>


    <script>

        const AUTH_KEY =
            "coe-dashboard-preview-access";


        const EXPECTED_HASH =
            "22ebc90a093739f2e2b8d6b9cb23f982ce287009a08065d49de2808d206150cd";


        async function sha256(
            text
        ) {

            const data =
                new TextEncoder()
                    .encode(
                        text
                    );


            const hashBuffer =
                await crypto.subtle.digest(
                    "SHA-256",
                    data
                );


            return Array
                .from(
                    new Uint8Array(
                        hashBuffer
                    )
                )
                .map(
                    byte =>
                        byte
                            .toString(
                                16
                            )
                            .padStart(
                                2,
                                "0"
                            )
                )
                .join(
                    ""
                );

        }


        function getNextPage() {

            const params =
                new URLSearchParams(
                    window.location.search
                );


            const next =
                params.get(
                    "next"
                );


            if (
                next
                &&
                next.startsWith(
                    "/"
                )
                &&
                !next.startsWith(
                    "//"
                )
            ) {

                return next;

            }


            return "/";

        }


        document
            .getElementById(
                "loginForm"
            )
            .addEventListener(
                "submit",
                async event => {

                    event.preventDefault();


                    const password =
                        document
                            .getElementById(
                                "password"
                            )
                            .value;


                    const passwordHash =
                        await sha256(
                            password
                        );


                    if (
                        passwordHash ===
                        EXPECTED_HASH
                    ) {

                        sessionStorage.setItem(
                            AUTH_KEY,
                            "granted"
                        );


                        window.location.replace(
                            getNextPage()
                        );


                        return;

                    }


                    document
                        .getElementById(
                            "errorMessage"
                        )
                        .textContent =
                            "Incorrect password. Please try again.";


                    document
                        .getElementById(
                            "password"
                        )
                        .select();

                }
            );

    </script>

</body>

</html>
